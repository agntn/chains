packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - typebox@1.3.15
  - "@agntn/*"

# One version per name, shared by the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/encodings": 0.2.0
    "@agntn/hashes": 0.7.2
    "@agntn/tools": 0.3.0
    "@modelcontextprotocol/server": 2.4.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.4
    ufo: 1.6.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.5.0
    "@iconify-json/lucide": 1.2.151
    "@iconify-json/simple-icons": 1.2.101
    "@iconify-json/token": 1.2.42
    "@iconify-json/vscode-icons": 1.2.96
    "@modelcontextprotocol/client": 2.4.0
    "@nuxt/content": 3.16.2
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/pi-coding-agent": 18.4.12
    "@types/node": 26.2.0
    "@vueuse/core": 15.0.0
    ai: 7.0.165
    changelogen: 0.6.2
    obuild: 0.4.43
    oxfmt: 0.75.0
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2006
    rolldown: 1.2.12
    shiki: 4.5.0
    typescript: 7.0.2
    vitest: 4.1.12
    wrangler: 4.128.0
  # Docus parses through @typescript-eslint, which wants a JS API TypeScript 7 no longer has.
  nuxt:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
